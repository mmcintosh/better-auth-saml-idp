name: Feature request
description: Something the IdP should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and which SP or standard needs it.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
