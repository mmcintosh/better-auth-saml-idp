# ADDENDUM-01 R4: bounded peer range, tested at the pinned minimum and the latest 1.7.x.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        better-auth: ["1.7.5", "latest-1.7"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: scripts/use-better-auth.sh ${{ matrix.better-auth }}
      - run: pnpm typecheck
      - run: pnpm lint          # Biome: recommended + security rules
      - run: pnpm docs:check    # every relative link and #anchor in README and docs/
      - run: pnpm -C examples/workers-hono typecheck
      - run: pnpm test          # node + workerd (D1/Drizzle, validateSchema on), incl. SP interop
      - run: pnpm test:wasm     # validator suite, node + workerd
      - run: pnpm pack:check    # dist build, publint, Are the Types Wrong

  # Every database-dependent behaviour against real database servers (test/adapters).
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            url: postgres://postgres:test@localhost:5432/postgres
          - db: mysql
            url: mysql://root:test@127.0.0.1:3306/mysql
          # A single-node replica set, as production MongoDB is: Better Auth's adapter uses
          # transactions, which standalone servers don't support.
          - db: mongodb
            url: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    # Both services start for every entry (GitHub Actions can't vary services per matrix entry).
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Service containers can't take arguments (--replSet), so MongoDB starts here.
      - if: matrix.db == 'mongodb'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$' && break; sleep 2; done
      - run: npx vitest run --project node test/adapters
        env: { ADAPTER_DB: "${{ matrix.db }}", ADAPTER_URL: "${{ matrix.url }}" }

  # Secret scan over the full git history (.gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --no-banner --redact -c /repo/.gitleaks.toml

  # Real Chromium over HTTPS (Playwright): Keycloak 26.4, SimpleSAMLphp 2.5 and a node-saml POST-binding
  # SP with a cross-site post-ACS redirect, against the example IdP on workerd.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { WRANGLER_SEND_METRICS: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }
