# Dependency vulnerabilities, in two tiers:
# - runtime dependencies (what `npm install better-auth-saml-idp` brings in) BLOCK: pnpm audit on
#   every push and PR, and GitHub's dependency review on what a PR adds;
# - everything in the lockfile, dev tooling included, is scanned by OSV-Scanner and REPORTED
#   under Security > Code scanning without blocking (dev tools don't ship).
name: Dependencies
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "41 5 * * *" }]
permissions: { contents: read }
jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm audit --prod --audit-level low

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: low
          fail-on-scopes: runtime
          # Licences a MIT package can depend on at runtime.
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, Python-2.0
          comment-summary-in-pr: never

  osv:
    if: github.event_name != 'pull_request'
    permissions: { contents: read, security-events: write, actions: read }
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: --lockfile=./pnpm-lock.yaml
      fail-on-vuln: false
