# Release: the full test suite, then the exact tarball that was tested is published to npm with
# provenance (a signed statement, from GitHub's OIDC token, of which commit and workflow built it)
# and attached to a GitHub release with its CycloneDX SBOM.
#
# - Push a tag `vX.Y.Z` matching package.json's version (and "private" removed) to publish.
# - Run it by hand (Actions > Release > Run workflow) for a dry run: everything except publishing,
#   with the tarball and SBOM kept as workflow artifacts.
# See CONTRIBUTING.md#releasing for the npm side (trusted publishing).
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:wasm && pnpm pack:check
      - run: pnpm audit --prod --audit-level low

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - id: meta
        env: { REF_NAME: "${{ github.ref_name }}", EVENT: "${{ github.event_name }}" }
        run: |
          version="$(node -p 'require("./package.json").version')"
          private="$(node -p 'require("./package.json").private === true')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "::error::tag $REF_NAME doesn't match package.json version $version"; exit 1; }
            [ "$private" = false ] || { echo "::error::package.json is still \"private\": true"; exit 1; }
          fi
      - run: pnpm build && mkdir -p out && pnpm pack --pack-destination out
      # The SBOM describes what a user installs: the tarball's runtime dependency tree.
      - run: |
          mkdir -p sbom-root && cd sbom-root && npm init -y >/dev/null
          # --legacy-peer-deps: peers (better-auth) are the host's, not part of this package.
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps ../out/*.tgz
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-root
          format: cyclonedx-json
          output-file: out/better-auth-saml-idp-${{ steps.meta.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: node scripts/sbom-add-libxml2.mjs out/better-auth-saml-idp-${{ steps.meta.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release, path: out/, retention-days: 30 }
      - if: github.event_name == 'push'
        run: npm publish out/*.tgz --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.meta.outputs.version }}" }
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" out/* --title "v$VERSION" --notes-file notes.md --verify-tag
