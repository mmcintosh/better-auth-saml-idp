# Weekly, grouped updates, each version at least 3 days old (cooldown, D-073: most npm malware is
# found and pulled within days). Security updates aren't delayed. Better Auth itself is excluded: the peer range is deliberate
# (ADDENDUM-01 R4) and new minors are tried by the upstream canary instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    groups:
      dev: { dependency-type: development, update-types: [minor, patch] }
      runtime: { dependency-type: production, update-types: [minor, patch] }
    ignore:
      - dependency-name: better-auth
      - dependency-name: "@better-auth/*"
  # The CharDB examples: Bun projects outside the pnpm workspace, so Dependabot keeps their bun.lock
  # in step itself. They stay on TypeScript 5: CharDB's Vite plugin uses the TypeScript JS API
  # (ts.ScriptTarget), which TypeScript 7's native compiler doesn't ship (2026-10-04). Better Auth is
  # left to the upstream canary, as above.
  - package-ecosystem: bun
    directories: ["/examples/chardb", "/examples/chardb-astro"]
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      chardb-examples: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: better-auth
      - dependency-name: "@better-auth/*"
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # The npm CLI the release job stages with (pinned by integrity; npm stage needs >= 11.15).
  # Only npm itself: its dependencies are bundled inside it, so updating one alone always fails.
  # Fixes for those arrive as a newer npm (alerts dismissed as tolerable risk, 2026-10-02).
  - package-ecosystem: npm
    directory: /.github/npm-cli
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    ignore:
      - dependency-name: undici
      - dependency-name: brace-expansion
      - dependency-name: ip-address
      - dependency-name: http-cache-semantics
      - dependency-name: postcss-selector-parser
  # e2e container images, pinned by digest (R4-L10).
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      actions: { patterns: ["*"] }
