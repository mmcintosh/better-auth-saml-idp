# OSV-Scanner (and OpenSSF Scorecard, which reads this file) ignores these advisories in this folder.
# This folder only installs the npm CLI that the release job stages with (D-050, D-070). These are
# npm's own *bundled* dependencies: they can't be updated on their own, never reach the published
# package, and run only inside the release job on GitHub's runner, on inputs we control. Dependabot
# ignores them too (.github/dependabot.yml); they go when a newer npm bundles fixed versions. Each
# entry expires, so it is looked at again.
