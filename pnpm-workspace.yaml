packages:
  # The examples in the pnpm workspace, listed by name rather than "examples/*" with exclusions:
  # Dependabot read the glob but not the exclusions, and updated the CharDB examples' package.json
  # against pnpm's lockfile. CharDB's two examples are Bun projects (CharDB's scaffold), outside the
  # workspace, with their own bun.lock and their own Dependabot entry.
  - "examples/nextjs"
  - "examples/workers-hono"

# Don't install a version published less than a day ago (D-073): most npm malware is found and
# pulled within hours. Dependabot waits 3 days (cooldown), so it never proposes a version this
# rejects. Better Auth is exempt, because the canary and CI's latest-1.7 row exist to try its newest
# releases at once; Socket Firewall still checks them in CI.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - better-auth
  - "@better-auth/*"
