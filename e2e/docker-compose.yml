version: "3.8" # needed by docker-compose v1; ignored by the v2 plugin
# Third-party SPs for the browser e2e (`pnpm e2e`), over HTTPS with the throwaway e2e CA.
# They never call the IdP server-to-server; only the browser does, as in real SSO.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /tls/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/key.pem
      KC_HTTPS_PORT: "8443"
      KC_HTTP_ENABLED: "false"
    ports: ["8080:8443"]
    volumes:
      - ./.generated/tls:/tls:ro
  simplesamlphp:
    image: cirrusid/simplesamlphp:v2.5.3.1.20261023T014150@sha256:ae33d1faa5ce1ca0171ffb30916261bdb90bc4e734154db254c9735de8696240
    environment:
      SSP_ADMIN_PASSWORD: e2e-only
      SSP_SECRET_SALT: e2e-only-not-secret
      SSP_LOG_LEVEL: "7"
      APACHE_CERT_NAME: e2e
    ports: ["8081:443"]
    volumes:
      - ./simplesamlphp/authsources.php:/var/simplesamlphp/config/authsources.php:ro
      - ./simplesamlphp/config-override.php:/var/simplesamlphp/config/config-override.php:ro
      - ./.generated/saml20-idp-remote.php:/var/simplesamlphp/metadata/saml20-idp-remote.php:ro
      - ./simplesamlphp/whoami.php:/var/www/whoami.php:ro
      - ./.generated/tls/cert.pem:/etc/ssl/certs/e2e.pem:ro
      - ./.generated/tls/key.pem:/etc/ssl/private/e2e.key:ro
